# Research areas shown on the faculty cards.
#
# A person's areas come from their `tags` in data/bouncmpe/people/*.json — the
# same tags also carry courses, roles and groups, so only the keys listed here
# are treated as research areas. Adding an area is a matter of adding its key
# and labels below; removing one hides it everywhere.
#
# The whole feature is switched off with `people.showResearchAreas: false`
# in config/_default/params.yml.

