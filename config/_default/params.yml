# ---------------------------------------------------------------------------
# Hextra theme parameters
# ---------------------------------------------------------------------------

navbar:
  displayTitle: true
  displayLogo: true
  logo:
    # Served from static/ (Hextra links the logo directly, it does not run it
    # through Hugo's asset pipeline).
    path: images/logo.png
    width: 28
    height: 28
  width: wide

page:
  width: wide

footer:
  enable: true
  # The copyright line is rendered by layouts/_partials/custom/footer.html from
  # site.Copyright, which is where the `{year}` placeholder gets expanded.
  displayCopyright: false
  displayPoweredBy: false
  width: wide

theme:
  # The site was light-only under Hinode; Hextra ships a dark mode, so the
  # toggle is offered but the site still opens light.
  default: light
  displayToggle: true

search:
  enable: true
  type: flexsearch
  flexsearch:
    index: content
    tokenize: forward

displayUpdatedDate: true
dateFormat: "2 January 2006"

highlight:
  copy:
    enable: true
    display: hover

# ---------------------------------------------------------------------------
# Department parameters (carried over from the Hinode setup)
# ---------------------------------------------------------------------------

# Named `welcomeBanner` because Hextra uses `params.banner` for its own
# site-wide announcement bar.
welcomeBanner:
  enabled: true

eventbar:
  enabled: true
  limit: 6

newsroom:
  grid_limit: 6
  image_settings:
    hero: "1400x700 webp q90 Smart"
    card: "800x450 webp q85 Smart"

people:
  image_settings: "500x500 webp q90 Top"

# Renamed from `social`: Hextra reserves `params.social` for its Open Graph
# metadata (it expects a map, not a list of links).
socialLinks:
  - name: "Twitter"
    icon: "twitter"
    url: "https://twitter.com/bogazici_cmpe"
    weight: 10
  - name: "GitHub"
    icon: "github"
    url: "https://github.com/bouncmpe"
    weight: 20
  - name: "YouTube"
    icon: "youtube"
    url: "https://www.youtube.com/@bogazici_cmpe"
    weight: 30

contact:
  address:
    en: "Department of Computer Engineering, Boğaziçi University, 34342 Bebek, Istanbul, Turkey"
    tr: "Bilgisayar Mühendisliği Bölümü, Boğaziçi Üniversitesi, 34342 Bebek, İstanbul, Türkiye"
  phone: "+90 212 359 45 23/24"
  fax: "+90 212 2872461"
